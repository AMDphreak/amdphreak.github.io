packages:
  - "."

# pnpm 12 reads these here. The package.json "pnpm" field is ignored.
allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true

overrides:
  "@centrmark/astro": "file:vendor/centrmark/packages/cmk-astro"
  "@centrmark/cmk-renderer": "file:vendor/centrmark/packages/cmk-renderer"
  "@centrmark/parse": "file:vendor/centrmark/packages/cmk-parse"
  "@content-tags/core": "file:vendor/content-tags/packages/core"
  "@content-tags/astro": "file:vendor/content-tags/packages/astro"
  "@content-tags/solid": "file:vendor/content-tags/packages/solid"
