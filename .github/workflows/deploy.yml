name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout content-tags
        uses: actions/checkout@v4
        with:
          repository: dev-centr/content-tags
          path: vendor/content-tags

      - name: Checkout centrmark
        uses: actions/checkout@v4
        with:
          repository: dev-centr/centrmark
          path: vendor/centrmark

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Build content-tags packages
        working-directory: vendor/content-tags
        run: |
          pnpm install
          pnpm -r --filter "!@content-tags/demo" run build

      - name: Build centrmark packages
        working-directory: vendor/centrmark
        run: |
          pnpm install
          pnpm --filter @centrmark/parse --filter @centrmark/cmk-renderer --filter @centrmark/astro run build

      - name: Install dependencies
        run: pnpm install

      # CentrMark CLI ships as a local Windows binary today; CI has no Linux build yet.
      # Skip .cmk posts in Actions so Markdown routes still deploy (restore when Linux CLI is published).
      - name: Skip CentrMark posts without Linux CLI
        run: |
          mkdir -p /tmp/centrmark-skipped
          find src/content/blog -name '*.cmk' -print -exec mv {} /tmp/centrmark-skipped/ \;

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
